name: Qualité du site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit accessibilité, responsive et liens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installer Playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: Vérifier la syntaxe des scripts
        run: |
          for f in assets/js/main.js server/devis.js api/devis.js netlify/functions/devis.js; do
            node --check "$f"
          done

      - name: Vérifier qu'aucun secret n'a été committé
        run: |
          MOTIFS='(re_[A-Za-z0-9]{20,}|21st_sk_[a-f0-9]{40,}|0x4[A-Za-z0-9]{30,}'
          MOTIFS="$MOTIFS"'|sk_(test|live)_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}'
          MOTIFS="$MOTIFS"'|pk_(test|live)_[A-Za-z0-9]{20,})'
          if grep -rIn -E "$MOTIFS" \
               --exclude-dir=.git --exclude-dir=node_modules \
               --exclude-dir=.claude --exclude-dir=.local . ; then
            echo "::error::Une clé secrète semble présente dans le dépôt."
            exit 1
          fi
          echo "Aucun secret détecté."

      - name: Vérifier les dépendances
        run: npm audit --audit-level=high

      - name: Banc d'essai de la billetterie
        run: node tools/tester-billetterie.mjs

      - name: Auditer le site
        run: node tools/audit.mjs

      - name: Vérifier que les pages générées sont à jour
        run: |
          python3 tools/generer-pages-packs.py
          python3 tools/appliquer-meta.py
          if ! git diff --quiet; then
            echo "::error::Les pages générées diffèrent des sources. Relancez les générateurs et committez."
            git --no-pager diff --stat
            exit 1
          fi
          echo "Pages générées à jour."

  lighthouse:
    name: Budget de performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Sans compression : les poids relevés ici sont donc les poids bruts,
      # alors qu'en production Netlify et Vercel servent tout en gzip
      # (environ un tiers). Le budget de .github/budget-lighthouse.json est
      # calé sur ces poids bruts, il est donc volontairement sévère.
      - name: Servir le site
        run: npx --yes http-server -p 8080 -s . &

      - name: Attendre le serveur
        run: npx --yes wait-on http://127.0.0.1:8080 --timeout 30000

      # Les pages de packs sont générées : elles apparaissent et disparaissent
      # avec l'offre. Une liste écrite en dur ici finit par pointer une page
      # supprimée — Lighthouse renvoie alors une erreur 404 qui masque le vrai
      # résultat des autres pages. On lit donc les pages réellement présentes.
      - name: Établir la liste des pages à mesurer
        id: pages
        run: |
          {
            echo 'urls<<FIN'
            echo 'http://127.0.0.1:8080/index.html'
            echo 'http://127.0.0.1:8080/billetterie.html'
            for f in packs/*.html; do
              [ -e "$f" ] || continue
              echo "http://127.0.0.1:8080/$f"
            done
            echo 'FIN'
          } >> "$GITHUB_OUTPUT"

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.pages.outputs.urls }}
          budgetPath: ./.github/budget-lighthouse.json
          uploadArtifacts: true
          temporaryPublicStorage: true
