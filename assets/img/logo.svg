<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Logo rubis">
  <defs>
    <linearGradient id="rubyTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2233d"/>
      <stop offset="100%" stop-color="#8a0b1f"/>
    </linearGradient>
    <linearGradient id="rubyBody" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#6d0817"/>
    </linearGradient>
  </defs>

  <!-- table (facette supérieure) -->
  <polygon points="34,28 66,28 78,40 22,40" fill="url(#rubyTop)"/>
  <!-- pavillon -->
  <polygon points="22,40 78,40 50,86" fill="url(#rubyBody)"/>
  <!-- facettes internes -->
  <polygon points="22,40 50,40 50,86" fill="#ffffff" opacity=".07"/>
  <polygon points="64,40 50,86 70,40" fill="#000000" opacity=".16"/>
  <!-- contour -->
  <path d="M34 28 H66 L78 40 L50 86 L22 40 Z" fill="none" stroke="#e8909c" stroke-opacity=".4" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M22 40 H78" fill="none" stroke="#e8909c" stroke-opacity=".3" stroke-width="1"/>
</svg>
