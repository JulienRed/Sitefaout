# Déploiement Netlify — site statique + fonction d'envoi du devis.

[build]
  publish = "."
  functions = "netlify/functions"

# Le formulaire appelle /api/devis quelle que soit la plateforme.
[[redirects]]
  from = "/api/devis"
  to = "/.netlify/functions/devis"
  status = 200

[[redirects]]
  from = "/api/billetterie"
  to = "/.netlify/functions/billetterie"
  status = 200

[[redirects]]
  from = "/api/paiement"
  to = "/.netlify/functions/paiement"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/verifier-billet"
  to = "/.netlify/functions/verifier-billet"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    # Deux ans, sous-domaines compris : après la première visite, le
    # navigateur refuse de rappeler le site en clair, y compris si
    # quelqu'un force un lien http:// sur un réseau partagé.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self' https://challenges.cloudflare.com https://plausible.io; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com https://plausible.io; upgrade-insecure-requests"

# La police est versionnée dans son nom de fichier : cache long.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
